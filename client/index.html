<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Trax | Real-time Group Tracking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <!-- Header Overlay -->
    <div class="overlay header-panel">
        <div class="header-top">
            <div class="header-title">
                <h1>Trax</h1>
            </div>
            <!-- Search Panel (Top) -->
            <div id="search-panel" class="header-search hidden">
                <div class="search-container">
                    <input id="destination-search" type="text" placeholder="Search for a place" autocomplete="off"
                        oninput="debounceSearch(this.value)">
                    <div id="search-results" class="search-results hidden"></div>
                </div>
            </div>
            <div id="status-display" class="status-badge">
                Not tracking
            </div>
        </div>
    </div>

    <!-- Floating Actions -->
    <div class="overlay floating-action">
        <div id="perspective-btn" class="fab" onclick="togglePerspective()" title="Perspective Mode">🧭</div>
        <div class="fab" onclick="locateMe()" title="Locate Me">📍</div>
        <div id="route-toggle" class="fab hidden" onclick="centerRoute()" title="Center Route">🏁</div>
    </div>

    <!-- Controls Panel -->
    <div id="controls-panel" class="overlay controls-panel">
        <!-- Join Group Form -->
        <div id="join-form" class="input-group">
            <h2 style="margin: 0 0 8px 0; font-size: 1.1rem;">Join Group</h2>
            <input id="username" type="text" placeholder="Your Name" autocomplete="off">
            <input id="room" type="text" placeholder="Invite Code" autocomplete="off">
            <button onclick="joinRoom()">
                Join Room
            </button>
            <button class="btn-secondary" onclick="joinRoom(true)">
                Demo Mode (Simulation)
            </button>
        </div>

        <!-- room-info moved to consolidated dashboard -->
    </div>

    <!-- Surgical Stats Dashboard -->
    <div id="group-stats" class="overlay stats-overlay hidden collapsed">
        <div class="dashboard-toggle" onclick="toggleStats()">
            <span id="dashboard-indicator">▲</span>
            <div id="dashboard-summary-text">Tracking...</div>
        </div>
        <div id="dashboard-details">
            <div id="room-info-container">
                <p id="room-info" style="font-size: 0.75rem; color: var(--text-light); margin: 0; text-align: center;">
                    Join a room to start tracking.
                </p>
            </div>
            <div class="stats-divider"></div>
            <h3 style="margin: 0; font-size: 0.9rem;">Group Metrics</h3>
            <div id="rider-list"
                style="max-height: 150px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;">
                <!-- Dynamic Rider Items -->
            </div>
            <div class="stats-divider"></div>
            <div class="stats-item">
                <span class="stats-label">Group Spread</span>
                <span id="group-spread" class="stats-value">-</span>
            </div>
            <div id="speed-alerts" style="margin-top: 4px;"></div>
        </div>
    </div>

    <!-- Map -->
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="js/app.js"></script>

</body>

</html>
