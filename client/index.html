<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Trax | Real-time Group Tracking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f8fafc;
            --surface: rgba(255, 255, 255, 0.9);
            --text: #1e293b;
            --text-light: #64748b;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --glass: blur(2px) saturate(180%);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
            transition: transform 0.3s cubic-bezier(0.1, 0, 0.3, 1);
            transform-origin: center;
        }

        /* Hero / Overlays */
        .overlay {
            position: absolute;
            z-index: 1000;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .header-panel {
            top: 16px;
            left: 16px;
            right: 16px;
            background: var(--surface);
            backdrop-filter: var(--glass);
            -webkit-backdrop-filter: var(--glass);
            padding: 12px 16px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            background: #e2e8f0;
            color: var(--text-light);
        }

        .status-on-route {
            background: #d1fae5;
            color: #065f46;
        }

        .status-off-route {
            background: #fee2e2;
            color: #991b1b;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }

            100% {
                opacity: 1;
            }
        }

        /* Controls Panel */
        .controls-panel {
            bottom: 0px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 400px;
            background: var(--surface);
            backdrop-filter: var(--glass);
            -webkit-backdrop-filter: var(--glass);
            padding: 2px;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .input-group {
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            background: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:active {
            transform: scale(0.98);
        }

        button:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: #f1f5f9;
            color: var(--text);
            margin-top: 8px;
        }

        /* Floating buttons */
        .floating-action {
            right: 10px;
            top: 30%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .fab {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--surface);
            backdrop-filter: var(--glass);
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Hidden when joined */
        .hidden {
            display: none !important;
        }

        /* Custom Leaflet Controls */
        .leaflet-control-zoom {
            border: none !important;
            box-shadow: var(--shadow) !important;
            border-radius: 12px !important;
            overflow: hidden;
        }

        .leaflet-control-zoom-in,
        .leaflet-control-zoom-out {
            background: var(--surface) !important;
            backdrop-filter: var(--glass) !important;
            border: none !important;
            color: var(--text) !important;
            width: 36px !important;
            height: 36px !important;
            line-height: 36px !important;
        }

        /* Tooltip & Popups */
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            padding: 4px;
        }

        .leaflet-popup-tip {
            background: white;
        }

        /* Search Bar Styles */
        .search-container {
            position: relative;
            /* margin-bottom: 12px; */
        }

        .leaflet-top {
            top: 15%;
        }

        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow);
            max-height: 200px;
            overflow-y: auto;
            z-index: 2000;
            border: 1px solid #e2e8f0;
            margin-top: 4px;
        }

        .search-item {
            padding: 10px 16px;
            cursor: pointer;
            font-size: 0.9rem;
            border-bottom: 1px solid #f1f5f9;
        }

        .search-item:last-child {
            border-bottom: none;
        }

        .search-item:hover {
            background: #f8fafc;
        }

        .status-leader {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #fcd34d;
        }

        /* Directional Indicator */
        .directional-icon {
            transition: transform 0.5s ease;
        }

        .bearing-arrow {
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 12px solid var(--primary);
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Header Panel Expansion */
        .header-panel {
            flex-direction: column;
            align-items: stretch;
            gap: 12px;
            padding: 16px;
            background: transparent;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        @media screen and (max-width: 768px) {
            .header-top {
                justify-content: center;
                gap: 10px
            }
        }

        .header-search {
            margin-top: 4px;
        }

        .fab-active {
            background: var(--primary) !important;
            color: white !important;
            box-shadow: 0 0 15px var(--primary);
        }

        /* Group Stats Panel */
        .stats-overlay {
            position: absolute;
            bottom: 24px;
            right: 24px;
            width: 260px;
            /* background: var(--surface); */
            background: transparent;
            backdrop-filter: var(--glass);
            padding: 16px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .stats-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
        }

        .stats-label {
            color: var(--text-light);
        }

        .stats-value {
            font-weight: 600;
            color: var(--text);
        }

        .speed-tag {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .speed-fast {
            background: #fee2e2;
            color: #b91c1c;
        }

        .speed-slow {
            background: #fef3c7;
            color: #92400e;
        }

        @media screen and (max-width: 768px) {
            .stats-overlay {
                bottom: 100px;
                right: 12px;
                left: 12px;
                width: auto;
            }
        }
    </style>
</head>

<body>

    <!-- Header Overlay -->
    <div class="overlay header-panel">
        <div class="header-top">
            <div class="header-title">
                <h1>Trax</h1>
            </div>
            <!-- Search Panel (Top) -->
            <div id="search-panel" class="header-search hidden">
                <div class="search-container">
                    <input id="destination-search" type="text" placeholder="Search for a place" autocomplete="off"
                        oninput="debounceSearch(this.value)">
                    <div id="search-results" class="search-results hidden"></div>
                </div>
            </div>
            <div id="status-display" class="status-badge">
                Not tracking
            </div>
        </div>


    </div>

    <!-- Floating Actions -->
    <div class="overlay floating-action">
        <div id="perspective-btn" class="fab" onclick="togglePerspective()" title="Perspective Mode">🧭</div>
        <div class="fab" onclick="locateMe()" title="Locate Me">📍</div>
        <div id="route-toggle" class="fab hidden" onclick="centerRoute()" title="Center Route">🏁</div>
    </div>

    <!-- Controls Panel -->
    <div id="controls-panel" class="overlay controls-panel">
        <!-- Join Group Form -->
        <div id="join-form" class="input-group">
            <h2 style="margin: 0 0 8px 0; font-size: 1.1rem;">Join Group</h2>
            <input id="username" type="text" placeholder="Your Name" autocomplete="off">
            <input id="room" type="text" placeholder="Invite Code" autocomplete="off">
            <button onclick="joinRoom()">
                Join Room
            </button>
            <button class="btn-secondary" onclick="joinRoom(true)">
                Demo Mode (Simulation)
            </button>
        </div>

        <p id="room-info" style="font-size: 0.75rem; color: var(--text-light); margin-top: 12px; text-align: center;">
            Join a room to start tracking.
        </p>
    </div>

    <!-- Group Stats Overlay (Initially Hidden) -->
    <div id="group-stats" class="overlay stats-overlay hidden">
        <h3 style="margin: 0; font-size: 0.9rem;">Group Metrics</h3>
        <div id="rider-list"
            style="max-height: 150px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;">
            <!-- Dynamic Rider Items -->
        </div>
        <div style="border-top: 1px solid rgba(255,255,255,0.2); padding-top: 8px;">
            <div class="stats-item">
                <span class="stats-label">Group Spread (Radius)</span>
                <span id="group-spread" class="stats-value">-</span>
            </div>
        </div>
        <div id="speed-alerts" style="margin-top: 4px;"></div>
    </div>

    <!-- Map -->
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        socket.on("connect", () => {
            console.log("✅ Socket connected to server. ID:", socket.id);
        });

        socket.on("mongodb_status", (data) => {
            console.log(`🔌 MongoDB Status: ${data.status}`);
            if (data.connected) {
                console.log("✅ Database is ready.");
            } else {
                console.warn("❌ Database is NOT connected. Check MONGODB_URI.");
            }
        });

        let username = "";
        let room = "";
        let inviteCode = "";
        let isLeader = false;
        let roomLeaderName = "";
        let roomLeaderId = "";
        let currentStatus = "Not tracking";
        let isDemoMode = false;
        let isPerspectiveMode = false;
        let myHeading = 0;
        let myCompassHeading = 0;
        let trackingInterval = null;
        let map = L.map('map', { zoomControl: false }).setView([28.6139, 77.2090], 13);
        L.control.zoom({ position: 'topright' }).addTo(map);

        let routeLine = null;
        let destinationMarker = null;
        let currentRouteCoords = [];
        let rerouteLine = null;
        let myMarker = null;
        let myPrevPos = null;
        let myLastTime = null;
        let mySpeed = 0;
        let otherUsers = {};
        let spreadHull = null;

        // Custom Icons
        const getCustomIcon = (color, isMe = false, heading = 0) => L.divIcon({
            className: 'custom-div-icon',
            html: `
                <div class="directional-icon" style="transform: rotate(${heading || 0}deg); position: relative;">
                    <div style="background-color: ${color}; width: ${isMe ? '18px' : '14px'}; height: ${isMe ? '18px' : '14px'}; border: 2.5px solid white; border-radius: 50%; box-shadow: 0 0 12px rgba(0,0,0,0.4);"></div>
                    ${(isMe || heading) ? `<div class="bearing-arrow" style="border-bottom-color: ${color}"></div>` : ''}
                </div>
            `,
            iconSize: isMe ? [18, 18] : [14, 14],
            iconAnchor: isMe ? [9, 9] : [7, 7]
        });

        const destIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/2776/2776067.png',
            iconSize: [36, 36],
            iconAnchor: [18, 36]
        });

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // UI Helpers
        function updateStatusBadge(message = null) {
            if (message) currentStatus = message;
            const statusEl = document.getElementById("status-display");

            let badgeText = currentStatus;
            let badgeClass = "status-badge";

            if (currentStatus.includes("OFF ROUTE") || currentStatus.includes("error") || currentStatus.includes("Denied")) {
                badgeClass += " status-off-route";
            } else if (currentStatus === "On Route") {
                badgeClass += " status-on-route";
            }

            if (isLeader) {
                badgeClass += " status-leader";
                badgeText += " (Leader)";
            } else if (roomLeaderName) {
                badgeText += ` (Ldr: ${roomLeaderName})`;
            }

            // Append distance if routing
            if (myMarker && destinationMarker) {
                const dist = getDistance(myMarker.getLatLng().lat, myMarker.getLatLng().lng,
                    destinationMarker.getLatLng().lat, destinationMarker.getLatLng().lng);
                badgeText += ` • ${(dist / 1000).toFixed(1)}km to dest`;
            }

            statusEl.innerText = badgeText;
            statusEl.className = badgeClass;
        }

        function togglePerspective() {
            // Request permission for iOS compass
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            startCompass();
                        }
                    })
                    .catch(console.error);
            } else {
                startCompass();
            }

            isPerspectiveMode = !isPerspectiveMode;
            document.getElementById("perspective-btn").classList.toggle("fab-active", isPerspectiveMode);

            if (!isPerspectiveMode) {
                rotateMap(0); // Reset rotation
            }

            if (isPerspectiveMode && myMarker) {
                const latlng = myMarker.getLatLng();
                map.setView(latlng, 18, { animate: true });
                if (myCompassHeading) rotateMap(myCompassHeading);
            }
        }

        function startCompass() {
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', handleOrientation, true);
            }
        }

        function handleOrientation(event) {
            let heading = 0;
            if (event.webkitCompassHeading) {
                heading = event.webkitCompassHeading;
            } else if (event.absolute) {
                heading = 360 - event.alpha;
            } else {
                return;
            }

            myCompassHeading = heading;
            if (myMarker) {
                myMarker.setIcon(getCustomIcon('#3b82f6', true, myCompassHeading));
                if (isPerspectiveMode) {
                    rotateMap(myCompassHeading);
                }
            }
        }

        function rotateMap(heading) {
            const mapEl = document.getElementById('map');
            if (isPerspectiveMode && heading !== 0) {
                // Scale up to 1.5x to hide corners when rotated
                mapEl.style.transform = `rotate(${-heading}deg) scale(1.6)`;
            } else {
                mapEl.style.transform = `rotate(0deg) scale(1)`;
            }
        }

        function updateRoomInfo() {
            const infoEl = document.getElementById("room-info");
            if (!room && !inviteCode) {
                infoEl.innerText = "Join a room to start tracking.";
                return;
            }
            let text = `<div style="background: rgba(255,255,255,0.1); padding: 2px; border-radius: 12px; margin-bottom: 0px; border: 1px solid rgba(255,255,255,0.2);">
                <div style="font-size: 0.65rem; text-transform: uppercase; color: var(--text-light); font-weight: bold; margin-bottom: 4px;">Share Invite Code</div>
                <div style="color: green; font-size: 1.2rem; font-weight: 800; letter-spacing: 2px;">${inviteCode || '...'}</div>
            </div>`;
            if (roomLeaderName) {
                text += `<div style="font-size: 0.85rem; color: var(--text-light);">Leader: <b>${roomLeaderName}</b> ${roomLeaderId === socket.id ? '(You)' : ''}</div>`;
            }
            infoEl.innerHTML = text;
        }

        // Search Functionality
        let searchTimeout = null;
        function debounceSearch(query) {
            clearTimeout(searchTimeout);
            if (!query.trim()) {
                document.getElementById("search-results").classList.add("hidden");
                return;
            }
            searchTimeout = setTimeout(() => performSearch(query), 500);
        }

        async function performSearch(query) {
            if (!isLeader) return;
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                displaySearchResults(data);
            } catch (err) {
                console.error("Search error:", err);
            }
        }

        function displaySearchResults(results) {
            const container = document.getElementById("search-results");
            container.innerHTML = "";
            if (results.length === 0) {
                container.classList.add("hidden");
                return;
            }

            results.forEach(res => {
                const div = document.createElement("div");
                div.className = "search-item";
                div.innerText = res.display_name;
                div.onclick = () => {
                    const lat = parseFloat(res.lat);
                    const lon = parseFloat(res.lon);
                    setDestination(lat, lon);
                    container.classList.add("hidden");
                    document.getElementById("destination-search").value = res.display_name;
                };
                container.appendChild(div);
            });
            container.classList.remove("hidden");
        }

        // Ensure map renders correctly on load
        setTimeout(() => map.invalidateSize(), 500);

        // Click on map to set destination
        map.on('click', function (e) {
            if (!username) return;
            if (!isLeader) {
                alert("Only the room leader can set a destination.");
                return;
            }
            setDestination(e.latlng.lat, e.latlng.lng);
        });

        async function setDestination(lat, lng) {
            if (!myMarker) {
                alert("Waiting for your location...");
                return;
            }

            const myPos = myMarker.getLatLng();
            const url = `https://router.project-osrm.org/route/v1/driving/${myPos.lng},${myPos.lat};${lng},${lat}?overview=full&geometries=geojson`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.routes && data.routes.length > 0) {
                    const coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                    socket.emit("set_route", {
                        destination: { lat, lng },
                        coordinates: coords
                    });
                }
            } catch (error) {
                console.error("Error fetching route:", error);
            }
        }

        socket.on("route_received", (data) => {
            const { destination, coordinates } = data;
            currentRouteCoords = coordinates;
            document.getElementById('route-toggle').classList.remove('hidden');

            if (destinationMarker) {
                destinationMarker.setLatLng([destination.lat, destination.lng]);
            } else {
                destinationMarker = L.marker([destination.lat, destination.lng], { icon: destIcon })
                    .addTo(map).bindPopup("<b>Destination</b>");
            }

            if (routeLine) {
                routeLine.setLatLngs(coordinates);
            } else {
                routeLine = L.polyline(coordinates, {
                    color: '#3b82f6',
                    weight: 6,
                    opacity: 0.7,
                    lineJoin: 'round'
                }).addTo(map);
            }
            map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });
        });

        function joinRoom(isDemo = false) {
            username = document.getElementById("username").value || (isDemo ? "Demo User" : "");
            const code = document.getElementById("room").value || (isDemo ? "DEMO1" : "");

            if (!username) {
                alert("Please enter your name");
                return;
            }

            socket.emit("join_room", { username, inviteCode: code });
            document.getElementById("join-form").classList.add("hidden");
            document.getElementById("search-panel").classList.remove("hidden");

            isDemoMode = isDemo;
            updateStatusBadge(`Room: ${room}`);
            updateRoomInfo();

            if (isDemo) {
                simulateLocation();
            } else {
                startTracking();
            }
        }

        function simulateLocation() {
            // Simulate Delhi location for demo purposes
            let lat = 28.6139 + (Math.random() - 0.5) * 0.01;
            let lng = 77.2090 + (Math.random() - 0.5) * 0.01;
            let heading = 0;

            const update = () => {
                const dLat = (Math.random() - 0.5) * 0.001;
                const dLng = (Math.random() - 0.5) * 0.001;
                lat += dLat;
                lng += dLng;

                heading = (Math.atan2(dLng, dLat) * 180 / Math.PI + 360) % 360;

                const now = Date.now();
                if (myPrevPos && myLastTime) {
                    const dt = (now - myLastTime) / 1000;
                    if (dt > 0) {
                        const d = getDistance(myPrevPos.lat, myPrevPos.lng, lat, lng);
                        mySpeed = d / dt;
                    }
                }
                myPrevPos = { lat, lng };
                myLastTime = now;

                if (myMarker) {
                    myMarker.setLatLng([lat, lng]);
                    myMarker.setIcon(getCustomIcon('#3b82f6', true, heading));
                    myMarker.getPopup().setContent(`<b>You (Demo)</b><br>Speed: ${(mySpeed * 3.6).toFixed(1)} km/h`);
                } else {
                    myMarker = L.marker([lat, lng], { icon: getCustomIcon('#3b82f6', true, heading) })
                        .addTo(map)
                        .bindPopup(`<b>You (Demo)</b><br>Speed: 0 km/h`);
                    map.setView([lat, lng], 15);
                }

                if (isPerspectiveMode) {
                    map.setView([lat, lng], 18, { animate: true });
                    rotateMap(heading);
                }

                socket.emit("send_location", { lat, lng, heading });
                updateStatusBadge();
                checkOffRoute(lat, lng);
                updateGroupStats();
            };

            update();
            trackingInterval = setInterval(update, 3000);
        }

        function startTracking() {
            if (trackingInterval) return; // In demo mode or already tracking

            updateStatusBadge("Locating...");

            trackingInterval = navigator.geolocation.watchPosition(
                (position) => {
                    const { latitude: lat, longitude: lng, heading } = position.coords;
                    myHeading = heading || 0;

                    const now = Date.now();
                    if (myPrevPos && myLastTime) {
                        const dt = (now - myLastTime) / 1000;
                        if (dt > 0) {
                            const d = getDistance(myPrevPos.lat, myPrevPos.lng, lat, lng);
                            mySpeed = d / dt;
                        }
                    }
                    myPrevPos = { lat, lng };
                    myLastTime = now;

                    if (myMarker) {
                        myMarker.setLatLng([lat, lng]);
                        myMarker.setIcon(getCustomIcon('#3b82f6', true, myHeading));
                        myMarker.getPopup().setContent(`<b>You</b><br>Speed: ${(mySpeed * 3.6).toFixed(1)} km/h`);
                    } else {
                        myMarker = L.marker([lat, lng], { icon: getCustomIcon('#3b82f6', true, myHeading) })
                            .addTo(map)
                            .bindPopup(`<b>You</b><br>Speed: 0 km/h`);
                        // ...

                        if (!routeLine) map.setView([lat, lng], 15);
                        if (currentStatus === "Locating...") {
                            updateStatusBadge(`Room: ${room}`);
                        }
                    }

                    if (isPerspectiveMode) {
                        map.setView([lat, lng], 18, { animate: true });
                        rotateMap(myHeading);
                    }

                    socket.emit("send_location", { lat, lng, heading: myHeading });
                    checkOffRoute(lat, lng);
                    updateGroupStats();
                },
                (error) => {
                    console.error("Location error:", error);
                    let msg = "Location error";
                    if (error.code === 1) msg = "GPS Denied";
                    else if (error.code === 2) msg = "GPS Unavailable";
                    else if (error.code === 3) msg = "GPS Timeout";
                    updateStatusBadge(msg);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        function checkOffRoute(lat, lng) {
            if (!currentRouteCoords.length) return;

            let minDistance = Infinity;
            for (const pt of currentRouteCoords) {
                const d = getDistance(lat, lng, pt[0], pt[1]);
                if (d < minDistance) minDistance = d;
            }

            if (minDistance > 50) {
                updateStatusBadge(`OFF ROUTE (${Math.round(minDistance)}m)`);
                if (minDistance > 100) autoReRoute(lat, lng);
            } else {
                updateStatusBadge("On Route");
                if (rerouteLine) {
                    map.removeLayer(rerouteLine);
                    rerouteLine = null;
                }
            }
        }

        async function autoReRoute(lat, lng) {
            if (!destinationMarker || rerouteLine) return;

            const dest = destinationMarker.getLatLng();
            const url = `https://router.project-osrm.org/route/v1/driving/${lng},${lat};${dest.lng},${dest.lat}?overview=full&geometries=geojson`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data.routes && data.routes.length > 0) {
                    const coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                    if (rerouteLine) map.removeLayer(rerouteLine);
                    rerouteLine = L.polyline(coords, {
                        color: '#f43f5e',
                        weight: 4,
                        opacity: 0.6,
                        dashArray: '10, 10'
                    }).addTo(map);
                }
            } catch (err) {
                console.error("Auto-reroute error:", err);
            }
        }

        function updateGroupStats() {
            if (!myMarker || !roomLeaderId) return;
            document.getElementById("group-stats").classList.remove("hidden");

            const riderListEl = document.getElementById("rider-list");
            riderListEl.innerHTML = "";

            const myPos = myMarker.getLatLng();
            const allPoints = [myPos];
            const riders = [];

            // 1. Calculate distances and collect points for spread
            Object.keys(otherUsers).forEach(id => {
                const pos = otherUsers[id].marker.getLatLng();
                const dist = getDistance(myPos.lat, myPos.lng, pos.lat, pos.lng);
                const isLdr = (id === roomLeaderId);

                riders.push({
                    id,
                    name: otherUsers[id].username,
                    distance: dist,
                    speed: otherUsers[id].speed,
                    isLeader: isLdr,
                    pos: pos
                });
                allPoints.push(pos);
            });

            // Sort riders by distance from me
            riders.sort((a, b) => a.distance - b.distance);

            // 2. Render Rider List
            riders.forEach(r => {
                const distStr = r.distance > 1000 ? (r.distance / 1000).toFixed(1) + "km" : Math.round(r.distance) + "m";
                const item = document.createElement("div");
                item.className = "stats-item";
                item.innerHTML = `
                    <span class="stats-label">${r.name}${r.isLeader ? ' (Ldr)' : ''}</span>
                    <span class="stats-value">→ ${distStr}</span>
                `;
                riderListEl.appendChild(item);
            });

            // 3. Group Spread (Radius from Center)
            if (allPoints.length > 1) {
                // Calculate Average Center
                let sumLat = 0, sumLng = 0;
                allPoints.forEach(p => { sumLat += p.lat; sumLng += p.lng; });
                const center = { lat: sumLat / allPoints.length, lng: sumLng / allPoints.length };

                // Find Radius (Max distance from center)
                let maxDist = 0;
                allPoints.forEach(p => {
                    const d = getDistance(center.lat, center.lng, p.lat, p.lng);
                    if (d > maxDist) maxDist = d;
                });

                document.getElementById("group-spread").innerText = maxDist > 1000 ? (maxDist / 1000).toFixed(1) + "km" : Math.round(maxDist) + "m";

                if (spreadHull) map.removeLayer(spreadHull);
                spreadHull = L.circle(center, {
                    radius: maxDist,
                    color: '#94a3b8',
                    weight: 1,
                    fillOpacity: 0.05,
                    dashArray: '5, 5'
                }).addTo(map);
            }

            // 4. Speed Alerts (Optimized)
            const alertsEl = document.getElementById("speed-alerts");
            alertsEl.innerHTML = "";
            const speeds = [{ name: "You", speed: mySpeed }];
            riders.forEach(r => speeds.push({ name: r.name, speed: r.speed }));

            const avgSpeed = speeds.reduce((acc, s) => acc + s.speed, 0) / speeds.length;
            if (avgSpeed > 5) { // Only show alerts if group is moving
                speeds.forEach(s => {
                    if (s.speed > avgSpeed * 1.5 && s.speed > 8) {
                        alertsEl.innerHTML += `<div class="stats-item"><span class="stats-label">${s.name}</span> <span class="speed-tag speed-fast">TOO FAST</span></div>`;
                    } else if (s.speed < avgSpeed * 0.5) {
                        alertsEl.innerHTML += `<div class="stats-item"><span class="stats-label">${s.name}</span> <span class="speed-tag speed-slow">LAGGING</span></div>`;
                    }
                });
            }
        }

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(Δφ / 2) ** 2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function locateMe() {
            if (myMarker) {
                map.setView(myMarker.getLatLng(), 16, { animate: true });
            } else {
                // Try to get location just once to center
                navigator.geolocation.getCurrentPosition(p => {
                    map.setView([p.coords.latitude, p.coords.longitude], 16);
                });
            }
        }

        function centerRoute() {
            if (routeLine) map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });
        }

        socket.on("receive_location", (data) => {
            let { id, username: otherName, lat, lng, heading } = data;
            if (id === socket.id) return;

            const now = Date.now();
            let speed = 0;

            if (otherUsers[id]) {
                const prev = otherUsers[id].marker.getLatLng();
                const dt = (now - otherUsers[id].lastTime) / 1000; // seconds
                if (dt > 0) {
                    const dist = getDistance(prev.lat, prev.lng, lat, lng);
                    speed = dist / dt; // m/s
                }

                otherUsers[id].marker.setLatLng([lat, lng]);
                otherUsers[id].marker.setIcon(getCustomIcon(otherUsers[id].color, false, heading));
                otherUsers[id].lastTime = now;
                otherUsers[id].speed = speed;
            } else {
                const colors = ['#e11d48', '#10b981', '#6366f1', '#f59e0b', '#8b5cf6'];
                const color = colors[Object.keys(otherUsers).length % colors.length];
                const marker = L.marker([lat, lng], {
                    icon: getCustomIcon(color, false, heading)
                }).addTo(map);

                otherUsers[id] = {
                    marker: marker,
                    username: otherName,
                    color: color,
                    lastTime: now,
                    speed: 0
                };
            }

            // Update popup with distance and speed
            let popupContent = `<b>${otherName}</b><br>Speed: ${(otherUsers[id].speed * 3.6).toFixed(1)} km/h`;
            if (destinationMarker) {
                const dist = getDistance(lat, lng, destinationMarker.getLatLng().lat, destinationMarker.getLatLng().lng);
                popupContent += `<br>${(dist / 1000).toFixed(1)}km to dest`;
            }
            otherUsers[id].marker.bindPopup(popupContent);

            updateGroupStats();
        });

        socket.on("leader_update", (data) => {
            console.log("Leader Update Received:", data);
            roomLeaderId = data.leaderId;
            roomLeaderName = data.leaderName;
            inviteCode = data.inviteCode;
            room = data.room || room;
            isLeader = (roomLeaderId === socket.id);

            updateStatusBadge();
            updateRoomInfo();

            // Disable/Hide search for non-leaders
            const searchInput = document.getElementById("destination-search");
            const searchPanel = document.getElementById("search-panel");
            if (isLeader) {
                searchInput.disabled = false;
                searchInput.placeholder = "Search for a place";
                searchPanel.classList.remove("hidden");
            } else {
                searchInput.disabled = true;
                searchInput.placeholder = "Only Leader can set destination";
                searchPanel.classList.add("hidden");
                document.getElementById("search-results").classList.add("hidden");
            }

            console.log("Leader update:", data);
        });

        socket.on("error_message", (msg) => {
            alert(msg);
        });

        socket.on("user_left", (id) => {
            if (otherUsers[id]) {
                map.removeLayer(otherUsers[id]);
                delete otherUsers[id];
            }
        });
    </script>
